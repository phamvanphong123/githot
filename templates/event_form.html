{% extends "base.html" %}{% block content %}<a class="back" href="{{ url_for('manage_events') }}">← Quay lại quản lý</a><section class="form-card"><div class="eyebrow">EVENT MANAGEMENT</div><h1>{{ 'Chỉnh sửa sự kiện' if event else 'Tạo sự kiện mới' }}</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Tên sự kiện *</label><input name="name" required maxlength="150" value="{{ event.name if event else '' }}">
<label>Mô tả</label><textarea name="description" rows="4">{{ event.description if event else '' }}</textarea>
<div class="two-col"><div><label>Thời gian bắt đầu *</label><input type="text" name="start_time" required placeholder="YYYY-MM-DD HH:MM" value="{{ event.start_time if event else '' }}"><small>Ví dụ: 2026-11-12 09:00</small></div><div><label>Hạn đăng ký *</label><input type="text" name="registration_deadline" required placeholder="YYYY-MM-DD HH:MM" value="{{ event.registration_deadline if event else '' }}"><small>Định dạng YYYY-MM-DD HH:MM</small></div></div>
<label>Địa điểm *</label><input name="location" required value="{{ event.location if event else '' }}">
<div class="two-col"><div><label>Phòng ban tổ chức *</label><select name="department_id" required>{% for d in departments %}<option value="{{ d.id }}" {% if event and event.department_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div><div><label>Số lượng tối đa *</label><input type="number" name="max_participants" min="1" required value="{{ event.max_participants if event else 30 }}"></div></div>
<label>Giới hạn phòng ban tham gia (không bắt buộc)</label><select name="target_department_id"><option value="">Tất cả nhân viên</option>{% for d in departments %}<option value="{{ d.id }}" {% if event and event.target_department_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select>
<div class="card-actions"><button class="primary">Lưu sự kiện</button><a class="button secondary" href="{{ url_for('manage_events') }}">Hủy</a></div></form></section>{% endblock %}
